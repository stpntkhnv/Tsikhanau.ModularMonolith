name: template

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  check-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Template check (two installs, three apps, part 3 path, update-core, two apps running, Aspire)
        run: bash template-only/scripts/check-template.sh --aspire

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Harness (54 mistakes planted one at a time, each caught as expected.txt says)
        run: bash template-only/Harness/run-mutations.sh . "$RUNNER_TEMP/harness"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results
          path: ${{ runner.temp }}/harness/results
          if-no-files-found: ignore

  rule-markers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          path: app

      - uses: actions/checkout@v5
        with:
          repository: stpntkhnv/Tsikhanau.Rulebook
          ssh-key: ${{ secrets.RULEBOOK_DEPLOY_KEY }}
          path: Tsikhanau.Rulebook

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: app/global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('app/global.json', 'app/**/*.props', 'app/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Link the rulebook that sits beside the app
        run: bash scripts/init.sh --rules-only

      - name: Build for the test listing
        run: dotnet build ModularMonolith.slnx -c Release

      - name: Rule markers
        run: dotnet run --file ../Tsikhanau.Rulebook/check-markers.cs -- .
